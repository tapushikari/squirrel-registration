<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Forestly — Welcome</title>
  <link rel="stylesheet" href="style.css?v=20261002bw1">
</head>
<body>
  <main class="scene" id="scene">
    <div class="grain"></div>
    <div class="moon"></div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="stars" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div class="ground ground-back"></div>
    <div class="ground ground-front"></div>

    <!-- Old wooden house -->
    <section class="house" aria-label="Old wooden house">
      <div class="chimney"><span></span><span></span></div>
      <div class="roof">
        <div class="roof-face"></div>
        <div class="roof-line"></div>
      </div>
      <div class="attic-window"><span></span></div>

      <div class="house-body">
        <div class="beam beam-v1"></div>
        <div class="beam beam-v2"></div>
        <div class="beam beam-h1"></div>
        <div class="beam beam-h2"></div>

        <div class="window window-left">
          <span></span><span></span>
        </div>
        <div class="window window-right">
          <span></span><span></span>
        </div>

        <div class="door">
          <div class="door-panel"></div>
          <div class="door-knob"></div>
        </div>
      </div>

      <div class="porch">
        <div class="porch-roof"></div>
        <div class="porch-floor"></div>
        <div class="post post-a"></div>
        <div class="post post-b"></div>
      </div>
    </section>

    <!-- Squirrel: pure CSS, no external image required -->
    <div class="squirrel" id="squirrel" aria-label="Squirrel">
      <div class="tail"><span></span></div>
      <div class="squirrel-body"></div>
      <div class="head">
        <span class="ear ear-a"></span>
        <span class="ear ear-b"></span>
        <span class="eye"></span>
        <span class="nose"></span>
      </div>
      <div class="arm"></div>
      <div class="leg leg-a"></div>
      <div class="leg leg-b"></div>
    </div>

    <!-- Magic box -->
    <div class="magic-box" id="magicBox">
      <div class="box-glow"></div>
      <div class="box-lid">
        <span class="lock"></span>
      </div>
      <div class="box-body">
        <span class="box-symbol">✦</span>
      </div>
      <div class="box-light"></div>
    </div>

    <div class="story" id="story">
      <p class="eyebrow">A LITTLE FOREST STORY</p>
      <h1 id="storyTitle">A quiet house in the woods…</h1>
      <p id="storyText">Someone is waiting on the old roof.</p>
    </div>

    <div class="progress" id="progress">
      <span class="progress-fill"></span>
    </div>

    <div class="controls">
      <button type="button" id="soundBtn" class="round-btn" aria-label="Toggle sound">♪</button>
      <button type="button" id="replayBtn" class="round-btn" aria-label="Replay animation">↻</button>
    </div>

    <!-- Authentication panel -->
    <section class="auth-wrap" id="authWrap" aria-hidden="true">
      <div class="auth-card">
        <button class="close-auth" id="closeAuth" type="button" aria-label="Close">×</button>

        <div class="auth-copy">
          <span class="mini-mark">✦</span>
          <p class="eyebrow">WELCOME HOME</p>
          <h2 id="authTitle">Enter the forest.</h2>
          <p id="authSubtitle">Sign in to continue your little journey.</p>
        </div>

        <div class="tabs">
          <button class="tab active" data-mode="login" type="button">Login</button>
          <button class="tab" data-mode="register" type="button">Register</button>
        </div>

        <form id="loginForm" class="auth-form active" novalidate>
          <label>
            Email
            <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label>
            Password
            <span class="password-field">
              <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
              <button class="show-pass" type="button" data-target="loginPassword">Show</button>
            </span>
          </label>
          <div class="form-row">
            <label class="check"><input id="remember" type="checkbox"> <span>Remember me</span></label>
            <button type="button" class="text-btn" id="forgotBtn">Forgot password?</button>
          </div>
          <button class="primary-btn" type="submit">Enter the house <span>→</span></button>
          <p class="switch-line">No account? <button type="button" class="text-btn switch-btn" data-mode="register">Create one</button></p>
        </form>

        <form id="registerForm" class="auth-form" novalidate>
          <label>
            Full name
            <input id="regName" type="text" autocomplete="name" placeholder="Your name" required>
          </label>
          <label>
            Email
            <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label>
            Password
            <span class="password-field">
              <input id="regPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
              <button class="show-pass" type="button" data-target="regPassword">Show</button>
            </span>
          </label>
          <label class="check terms"><input id="terms" type="checkbox"> <span>I agree to the demo terms.</span></label>
          <button class="primary-btn" type="submit">Create account <span>→</span></button>
          <p class="switch-line">Already registered? <button type="button" class="text-btn switch-btn" data-mode="login">Login</button></p>
        </form>

        <div class="success" id="success">
          <div class="success-icon">✓</div>
          <p class="eyebrow">WELCOME</p>
          <h3 id="successTitle">You are inside.</h3>
          <p id="successText">The little house is yours for this visit.</p>
          <button class="primary-btn" id="successBack" type="button">Continue</button>
        </div>

        <p class="toast" id="toast" role="status"></p>
      </div>
    </section>
  </main>

  <script src="script.js?v=20261002bw1"></script>
</body>
</html>
